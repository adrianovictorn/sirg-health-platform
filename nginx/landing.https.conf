limit_req_zone $binary_remote_addr zone=sirg_landing:5m rate=10r/s;

server {
    listen 443 ssl;
    server_name ${LANDING_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${LANDING_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${LANDING_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Resolvido a cada requisição: se o container da landing cair, só ela
    # responde 502 — o nginx (e o sistema do município) continua de pé.
    resolver 127.0.0.11 valid=10s;

    location / {
        limit_req zone=sirg_landing burst=40 nodelay;

        set $landing http://landing:3000;
        proxy_pass         $landing;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
