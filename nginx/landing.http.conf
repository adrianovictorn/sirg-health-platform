server {
    listen 80;
    server_name ${LANDING_DOMAIN};

    # Desafio HTTP-01 do certbot (certbot certonly --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${LANDING_DOMAIN}$request_uri;
    }
}
