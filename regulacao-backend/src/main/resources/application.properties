# Nome da Aplicação
spring.application.name=regulacao-marcacao

# Perfil padrão (opcional, mas bom ter)

# Configuração do PostgreSQL (COMUM PARA OS DOIS)
spring.datasource.url=jdbc:postgresql://localhost:5432/dev_marcacao_database
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate e Flyway (COMUM PARA OS DOIS)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Chave de segurança JWT (COMUM PARA OS DOIS)
api.security.token.secret=minha-chave-secreta-super-dificil-de-adivinhar-123456

flyway.cleanDisabled=true
flyway.ignoreMissingMigrations=true
flyway.validateOnMigrate=true

# Porta do servidor para Conceição do Almeida
server.port=8080

# File upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/profile-pictures

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Propriedades específicas do município
app.municipio.nome-identificador=CONCEICAO_DO_ALMEIDA
app.municipio.queue-name=fila_conceicao_do_almeida
app.notifications.ignore-self-executor=false

# API de dados abertos do CNES (DATASUS) — consulta de estabelecimentos.
# Pública, sem autenticação. Usada só para preencher o cadastro; se cair, o
# cadastro manual continua funcionando (503 tratado no GlobalExceptionHandler).
app.cnes.base-url=https://apidadosabertos.saude.gov.br
app.cnes.timeout-conexao-ms=3000
app.cnes.timeout-leitura-ms=8000

# ATENÇÃO: o CNES usa o código IBGE de 6 dígitos, SEM o dígito verificador.
# Conceição do Almeida = 290830 (IBGE completo 2908309)
# São Felipe           = 292910 (IBGE completo 2929107)
# Passar 7 dígitos devolve lista vazia sem erro. Sobrescreva em produção via
# env APP_CNES_CODIGO_MUNICIPIO.
app.cnes.codigo-municipio=290830

# Webhook da WhatsApp Business Cloud API (Meta) — /api/webhooks/whatsapp.
# Vazio = integração desligada (a rota responde 404). Precisa dos DOIS valores.
# NUNCA commitar valor real: em produção vêm do .env da VPS, via
# WHATSAPP_VERIFY_TOKEN e WHATSAPP_APP_SECRET (ver docker-compose.prod.yaml).
app.whatsapp.verify-token=
app.whatsapp.app-secret=

# ENVIO de mensagens pelo WhatsApp (confirmação, remarcação, cancelamento e
# lembrete de agendamento). Independente do webhook acima.
# Vazio = não configurado: nada é enfileirado e a instância opera como antes.
# Precisa dos DOIS valores. NUNCA commitar valor real: em produção vêm do .env
# da VPS (WHATSAPP_ACCESS_TOKEN e WHATSAPP_PHONE_NUMBER_ID).
# Mesmo configurado, o envio nasce DESLIGADO: quem liga é um ADMIN, em
# /admin/whatsapp.
app.whatsapp.envio.access-token=
app.whatsapp.envio.phone-number-id=
# Versão da Graph API. Confira a versão vigente no painel da Meta ao implantar.
app.whatsapp.envio.api-version=v23.0
# Trava contra envio em massa: o que passar do limite no dia fica registrado
# como não enviado (não é reenviado sozinho no dia seguinte).
app.whatsapp.envio.limite-diario=200
# Lista de números de teste, separados por vírgula (55 + DDD + número).
# Enquanto preenchida, SÓ esses números recebem. Deixe preenchida em ambiente
# de desenvolvimento com cópia de dados reais e na primeira ativação.
app.whatsapp.envio.numeros-teste=
# Minutos que o aviso de cancelamento espera antes de sair. Remarcar é excluir
# e agendar de novo: se o item for reagendado nesse intervalo, sai uma única
# mensagem de remarcação.
app.whatsapp.envio.cancelamento-atraso-minutos=10
# Nomes dos templates aprovados no WhatsApp Manager (categoria utilidade, pt_BR).
app.whatsapp.envio.template.confirmacao=sirg_confirmacao_agendamento
app.whatsapp.envio.template.cancelamento=sirg_cancelamento_agendamento
app.whatsapp.envio.template.lembrete=sirg_lembrete_agendamento

# CORS — lista separada por vírgula; sobrescreva em produção via env CORS_ALLOWED_ORIGINS
cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://melida-nonstrategical-taliyah.ngrok-free.dev

# Flyway (Produção): evitar falha por migrations antigas renomeadas (V1–V5)
# e impedir operações destrutivas.




