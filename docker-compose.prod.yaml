version: "3.8"

networks:
  sirg_net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:

services:

  # ─── Banco de Dados ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: sirg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sirg_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Mensageria ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sirg_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - sirg_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./regulacao-backend
      dockerfile: Dockerfile
    container_name: sirg_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      API_SECURITY_TOKEN_SECRET:  ${JWT_SECRET}
      SPRING_RABBITMQ_HOST:       rabbitmq
      SPRING_RABBITMQ_PORT:       5672
      SPRING_RABBITMQ_USERNAME:   ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD:   ${RABBITMQ_PASSWORD}
      APP_MUNICIPIO_NOME_IDENTIFICADOR: ${MUNICIPIO_NOME}
      APP_MUNICIPIO_QUEUE_NAME:         ${MUNICIPIO_QUEUE}
      APP_UPLOAD_DIR:             /app/uploads/profile-pictures
      CORS_ALLOWED_ORIGINS:       ${APP_ORIGIN}
      APP_WHATSAPP_VERIFY_TOKEN:  ${WHATSAPP_VERIFY_TOKEN:-}
      APP_WHATSAPP_APP_SECRET:    ${WHATSAPP_APP_SECRET:-}
      APP_WHATSAPP_ENVIO_ACCESS_TOKEN:    ${WHATSAPP_ACCESS_TOKEN:-}
      APP_WHATSAPP_ENVIO_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      APP_WHATSAPP_ENVIO_LIMITE_DIARIO:   ${WHATSAPP_LIMITE_DIARIO:-200}
      APP_WHATSAPP_ENVIO_NUMEROS_TESTE:   ${WHATSAPP_NUMEROS_TESTE:-}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - sirg_net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./regulacao-frontend
      dockerfile: Dockerfile
    container_name: sirg_frontend
    restart: unless-stopped
    environment:
      ORIGIN: ${APP_ORIGIN}
      PUBLIC_MUNICIPIO_NOME: ${MUNICIPIO_NOME_DISPLAY}
      PUBLIC_MUNICIPIO_BRASAO: ${MUNICIPIO_BRASAO:-brasao_conceicao.png}
    networks:
      - sirg_net
    depends_on:
      - backend

  # ─── Landing pública (opcional — só sobe com COMPOSE_PROFILES=landing) ─────────
  # Ligada apenas na VPS de São Felipe, que serve a landing em LANDING_DOMAIN.
  # Sem o profile, `up` ignora o serviço e nada muda nas outras instâncias.
  landing:
    profiles: ["landing"]
    build:
      context: ./sirg-landing
      dockerfile: Dockerfile
    container_name: sirg_landing
    restart: unless-stopped
    environment:
      ORIGIN: https://${LANDING_DOMAIN:-localhost}
      PUBLIC_SITE_URL: https://${LANDING_DOMAIN:-localhost}
      PUBLIC_INDEXAVEL: ${LANDING_INDEXAVEL:-false}
      # *_API é lido pelo servidor da landing; São Felipe vai direto ao backend local.
      SIRG_SAOFELIPE_API: ${SIRG_SAOFELIPE_API:-http://backend:8080}
      SIRG_SAOFELIPE_ACESSO: ${SIRG_SAOFELIPE_ACESSO:-https://sirgsaofelipe.com/login}
      SIRG_SAOFELIPE_MUNICIPIO: ${SIRG_SAOFELIPE_MUNICIPIO:-SAO_FELIPE}
      SIRG_CONCEICAO_API: ${SIRG_CONCEICAO_API:-}
      SIRG_CONCEICAO_ACESSO: ${SIRG_CONCEICAO_ACESSO:-}
      SIRG_CONCEICAO_MUNICIPIO: ${SIRG_CONCEICAO_MUNICIPIO:-CONCEICAO_DO_ALMEIDA}
    networks:
      - sirg_net

  # ─── Nginx (entrada única nas portas 80/443) ──────────────────────────────────
  # nginx/start.sh gera a configuração; a landing só entra se LANDING_DOMAIN
  # estiver definido (ver nginx/start.sh e INFRA.md).
  nginx:
    image: nginx:1.27-alpine
    container_name: sirg_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_DOMAIN: ${NGINX_DOMAIN}
      LANDING_DOMAIN: ${LANDING_DOMAIN:-}
    volumes:
      - ./nginx:/etc/nginx/sirg:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    command: ["/bin/sh", "/etc/nginx/sirg/start.sh"]
    networks:
      - sirg_net
    depends_on:
      - frontend
      - backend
