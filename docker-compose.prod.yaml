version: "3.8"

networks:
  sirg_net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:

services:

  # ─── Banco de Dados ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: sirg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sirg_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Mensageria ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sirg_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - sirg_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./regulacao-backend
      dockerfile: Dockerfile
    container_name: sirg_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      API_SECURITY_TOKEN_SECRET:  ${JWT_SECRET}
      SPRING_RABBITMQ_HOST:       rabbitmq
      SPRING_RABBITMQ_PORT:       5672
      SPRING_RABBITMQ_USERNAME:   ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD:   ${RABBITMQ_PASSWORD}
      APP_MUNICIPIO_NOME_IDENTIFICADOR: ${MUNICIPIO_NOME}
      APP_MUNICIPIO_QUEUE_NAME:         ${MUNICIPIO_QUEUE}
      APP_UPLOAD_DIR:             /app/uploads/profile-pictures
      CORS_ALLOWED_ORIGINS:       ${APP_ORIGIN}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - sirg_net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./regulacao-frontend
      dockerfile: Dockerfile
    container_name: sirg_frontend
    restart: unless-stopped
    environment:
      ORIGIN: ${APP_ORIGIN}
      PUBLIC_MUNICIPIO_NOME: ${MUNICIPIO_NOME_DISPLAY}
    networks:
      - sirg_net
    depends_on:
      - backend

  # ─── Nginx (entrada única na porta 80) ────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: sirg_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_DOMAIN: ${NGINX_DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: >
      /bin/sh -c "envsubst '$$NGINX_DOMAIN' < /etc/nginx/nginx.conf.template
      > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    networks:
      - sirg_net
    depends_on:
      - frontend
      - backend
